name: Deploy THE AMCOL WAY

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'First deployment only: keep the game closed until Access is configured'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: amcol-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
      STAFF_EMAILS: ${{ vars.STAFF_EMAILS }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compile Worker without deploying
        run: npm run build
      - name: Validate production settings
        if: ${{ !inputs.bootstrap }}
        run: npm run configure
      - name: Configure a closed first deployment
        if: ${{ inputs.bootstrap }}
        run: npm run configure -- --bootstrap
      - name: Apply migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module -e 'for (const name of ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"]) if (!process.env[name]) throw new Error("Missing GitHub Actions secret: " + name)'
          npm run db:remote
          npm run deploy
